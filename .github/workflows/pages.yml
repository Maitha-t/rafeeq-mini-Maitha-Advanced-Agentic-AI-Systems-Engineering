name: Deploy learner portal to Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "reference-results/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy static bilingual portal
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare portal and reference contracts
        run: |
          mkdir -p _site/reference-results
          cp -R docs/. _site/
          cp -R reference-results/. _site/reference-results/

      - name: Upload portal artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy portal
        id: deployment
        uses: actions/deploy-pages@v4
